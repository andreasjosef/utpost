server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: okända sökvägar (t.ex. /guider/kebnekaise vid omladdning) ger index.html, så routern tar över.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vites filer har innehållshash i namnet, så de kan cachas för alltid.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API:et nås bara härifrån: det har ingen publicerad port i compose.yml.
  location /api/ {
    proxy_pass http://api:4000;
  }
  location /graphql {
    proxy_pass http://api:4000;
  }
}
